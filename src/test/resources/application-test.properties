spring.application.name=RealEstate
spring.output.ansi.enabled=ALWAYS

cloudinary.url=cloudinary://test:test@test
property.image.folder=test-properties

admin.username=admin@test.com
admin.password=Admin123!

security.jwt.refresh-token-duration=604800
security.jwt.access-token-duration=8000
security.authorization-server.url=http://localhost:8080
security.cors.allowed-origins=http://localhost:5173,http://localhost:3000

security.logout.redirect-url=/login?logout

security.clients.swagger.client-id=swagger
security.clients.swagger.redirect-uri=http://localhost:8080/swagger-ui/oauth2-redirect.html

security.clients.postman.client-id=postman
security.clients.postman.redirect-uri=https://oauth.pstmn.io/v1/callback

security.clients.spa.client-id=spa
security.clients.spa.redirect-uri=http://localhost:5173/oauth2/callback

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.oauth.client-id=swagger
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid profile

jwt.public.key=classpath:app.pub
jwt.private.key=classpath:app.key

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=false
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never